name: CyToolsCore conformance
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --keyring-provider disabled -e ".[mcp,dev]"
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
