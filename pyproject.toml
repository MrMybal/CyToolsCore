[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cytools-core"
version = "0.9.0"
description = "Portable CyTools v1 standard and standalone tool runtime"
requires-python = ">=3.11"
authors = [{name = "Cyberalien"}]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.23,<5", "psutil>=6,<8"]

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
cytools = "cytools_core.scaffold:main"
cytool-test = "cytool_test.__main__:main"

[tool.setuptools.packages.find]
include = ["cytools_core*", "cytool_test*"]

[tool.setuptools.package-data]
cytools_core = ["schemas/*.json", "templates/*"]
cytool_test = ["CyTool.json"]

[tool.setuptools.data-files]
"share/cytools-core/Docs" = ["Docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
