[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cytools-core"
version = "0.11.0"
description = "Portable CyTools v1 standard and standalone tool runtime"
requires-python = ">=3.11"
authors = [{name = "Cyberalien"}]
license = "MIT"
license-files = ["LICENSE", "LICENCES/*.txt"]
dependencies = ["jsonschema>=4.23,<5", "psutil>=6,<8"]

[project.optional-dependencies]
mcp = [] # Compatibility extra; communication is native CyMCPSDK.
dev = ["pytest>=8,<10", "build>=1,<2", "mcp==1.30.0"]

[project.scripts]
cytools = "cytools_core.scaffold:main"
cytool-test = "cytool_test.__main__:main"

[tool.setuptools.packages.find]
include = ["cytools_core*", "cytool_test*"]

[tool.setuptools.package-data]
cytools_core = ["schemas/*.json", "templates/*", "native/*.dll", "native/*.so", "native/*.dylib", "native/*.exe", "native/cytools-native", "native/LICENCES/*"]
cytool_test = ["CyTool.json"]

[tool.setuptools.data-files]
"share/cytools-core/Docs" = ["Docs/*.md"]
"share/cytools-core/Examples/NativeClient" = ["Examples/NativeClient/*"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
